name: Matrix build and dependency cache

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }} with Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node and restore npm cache
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Report cache result
        shell: bash
        run: |
          if [ "${{ steps.setup-node.outputs.cache-hit }}" = "true" ]; then
            echo "Cache Restored: exact dependency cache hit"
          else
            echo "Cache Miss: dependencies will be installed and saved after success"
          fi
      - name: Install from lockfile
        run: npm ci
      - name: Run smoke check
        run: npm test
